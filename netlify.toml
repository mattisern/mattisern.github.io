# Netlify deploys only the booking app (book.lightly.io).
# lightly.io itself is served by GitHub Pages from the rest of this repo.
[build]
  base = "booking"
  command = "npm run build"
  publish = ".next"
  # Skip deploys when a push only touches the main site, not booking/.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
